    in_menu                 yes
    filter                  All
        rule                    Category not_contains Mature
        rule                    Category contains ^(Shooter|Fighter|Sports|Platform|Puzzle|Driving|Maze|Ball & Paddle|Quiz|Music Game|Tabletop|MultiGame|Multiplay|Arcade|Climbing|Whac-A-Mole|Redemption Game|TTL|Bartop|Simulation)
