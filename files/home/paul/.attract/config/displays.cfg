# Generated by Attract-Mode Plus v3.2.3
#
# Each genre is its own DISPLAY rather than a filter inside one display, so the
# joystick's left/right cycles straight through them. Filters would have worked
# too and cost less memory, but they hide behind a button combo (right+Button0)
# and Paul expects left/right to change the list -- which is the more natural
# reading of a cabinet with a single 8-way stick.
#
# All of these point at the same mame-all romlist and differ only in their rule.
# "My Cabinet" is the exception: it uses the small curated romlist, whose six
# games have per-game MAME inis (shaders, input maps) that the merged set does
# not.

display All Games
    layout                  BasicPlus
    romlist                 mame-all
    in_cycle                yes
    in_menu                 yes
    filter                  All

display Best Games
    layout                  BasicPlus
    romlist                 mame-all
    in_cycle                yes
    in_menu                 yes
    filter                  Best Games
        rule                    Tags contains bestgames

display Favourites
    layout                  BasicPlus
    romlist                 mame-all
    in_cycle                yes
    in_menu                 yes
    filter                  Favourites
        rule                    Favourite equals 1

display Shooters
    layout                  BasicPlus
    romlist                 mame-all
    in_cycle                yes
    in_menu                 yes
    filter                  Shooters
        rule                    Category contains Shooter

display Beat 'em ups
    layout                  BasicPlus
    romlist                 mame-all
    in_cycle                yes
    in_menu                 yes
    filter                  Beat 'em ups
        rule                    Category contains Fighter / 2.5D

display Fighters
    layout                  BasicPlus
    romlist                 mame-all
    in_cycle                yes
    in_menu                 yes
    filter                  Fighters
        rule                    Category contains Fighter / Versus

display 2P Co-op
    layout                  BasicPlus
    romlist                 mame-all
    in_cycle                yes
    in_menu                 yes
    filter                  2P Co-op
        rule                    Extra contains sim

display My Cabinet
    layout                  BasicPlus
    romlist                 mame
    in_cycle                yes
    in_menu                 yes
    filter                  All
    filter                  Favourites
        rule                    Favourite equals 1

