# Cabinet: WirePlumber ships device.routes.default-sink-volume = 0.064
# (40% on the cubic scale, i.e. -24 dB). The vc4hdmi card has no hardware
# mixer, so that software attenuation is the only gain stage and it makes
# the cabinet far too quiet. Start every new sink at unity instead.
wireplumber.settings = {
  device.routes.default-sink-volume = 1.0
}
