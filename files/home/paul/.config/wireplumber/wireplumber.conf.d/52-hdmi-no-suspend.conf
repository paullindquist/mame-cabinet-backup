# Cabinet: never suspend the HDMI sink.
#
# vc4's HDMI audio codec does not reliably survive a suspend/resume cycle.
# When PipeWire idled the sink and then tried to reopen it, the codec had a
# blank ELD and rejected the open:
#     kernel:   hdmi-audio-codec.2.auto: HDMI: Unknown ELD version 0
#     pipewire: spa.alsa: 'hdmi:0': playback open failed: Unknown error 524
# (524 = ENOTSUPP). WirePlumber then destroyed and recreated the node, which
# silently broke every link into it -- the frontend and MAME kept "playing"
# into a node that no longer existed.
#
# Holding the PCM open permanently sidesteps the whole resume path. It also
# removes the clipped-first-note artifact HDMI sinks get on wake.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
