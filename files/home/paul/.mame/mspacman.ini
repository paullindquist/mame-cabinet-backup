# Per-game overrides for Ms. Pac-Man (Midway / GCC, 1981).
# Found via inipath ($HOME/.mame;/etc/mame) as <gamename>.ini.
#
# Same GLSL shader as swimmer.ini. See that file for the full background; the
# short version is that MAME disables GLSL unless prescale is 1, so the shader
# and the -effect PNG overlay are mutually exclusive, and the shader draws the
# scanlines itself.
#
# Why this game needs it even though it never scrolls:
#   rotate=90, raster 288x224 -> displayed 224x288 portrait
#   keepaspect fits that into 1280x960 as 720x960
#     X: 720/224 = 3.214   NOT exact
#     Y: 960/288 = 3.333   NOT exact
# Both axes are uneven, and at ~3.2x a source pixel lands on either 3 or 4
# screen pixels -- a 33% variation. Swimmer only had this vertically and at
# 25%. On 8x8 characters it reads as letters that squish and stretch, which is
# exactly what Paul reported. Sharp bilinear fixes it by confining the blend to
# one screen pixel at each texel seam instead of rounding whole pixels up or
# down.
#
# The shader needs no rotation-specific changes: it derives the scale per axis
# from fwidth(), which already accounts for MAME's rotation. Here that yields
# 3.333 on the texture's x axis and 3.214 on its y axis, correctly swapped.
#
# SCANLINE ORIENTATION: the shader auto-detects which texel axis runs down the
# screen (via dFdy) and phases the bands off that one, so they always come out
# HORIZONTAL regardless of rotation. Paul asked for horizontal here rather than
# the authentic vertical -- a real Ms. Pac-Man has its CRT physically rotated,
# so its 224 raster lines run vertically from where the player stands.
# The same shader still behaves identically on upright games like swimmer.
#
# Mostly-black game, so scanlines only show on the lit elements -- black stays
# black whatever the depth. scanline-light is a reasonable starting point.

prescale                  1
effect                    none
gl_glsl                   1
gl_glsl_filter            1
glsl_shader_mame0         /home/paul/arcade/shaders/scanline-light
