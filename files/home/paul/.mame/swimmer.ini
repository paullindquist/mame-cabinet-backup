# Per-game overrides for Swimmer (Tehkan 1982).
# MAME finds this via inipath ($HOME/.mame;/etc/mame) as <gamename>.ini.
# Per-game on purpose: mk2 (400x254) is the priority game and must not be
# disturbed by anything tried here.
#
# The problem: shimmer on scrolling content only.
#   source 256x224 -> screen 1280x960
#   X: 1280/256 = 5.000  exact
#   Y:  960/224 = 4.286  NOT exact
# With nearest-neighbour (filter 0), a source row must occupy a whole number
# of screen rows, so 64 of the 224 rows take 5 pixels and the other 160 take
# 4. Static art hides this -- the tall rows never move. Scrolling art does
# not: each row slides between 4px and 5px every frame, which reads as
# shimmer on the moving parts and nothing else. Swimmer scrolls vertically,
# so it is the worst case.
#
# FIRST ATTEMPT, REVERTED: "unevenstretchx 1" to force an integer vertical
# factor. It did stop the shimmer, but it also silently killed the scanline
# overlay -- confirmed by comparison, since mk2 still had scanlines on the
# unchanged global fractional path. On this renderer, integer scaling and
# the -effect overlay are mutually exclusive. Do not go back to it.
#
# WHAT ACTUALLY WORKS: leave scaling fractional so the overlay keeps drawing,
# and remove the shimmer at its real source instead. The shimmer is caused by
# nearest-neighbour snapping, not by fractional scaling. With bilinear on, a
# source row may land between screen pixels and gets blended across them, so
# nothing snaps as the image scrolls.
#
# Cost: a slight softening. prescale 2 limits it -- the image is first
# doubled with hard edges (256x224 -> 512x448) and only the remaining 2.14x
# is filtered, so pixel edges stay largely intact. The scanline overlay is
# tiled at source x prescale, so its 2-row period still maps to exactly one
# dark and one light band per source row.
#
# PRESCALE 4 WAS TRIED AND REVERTED 2026-08-03. It made the scanlines
# sharper but the scrolling artifact clearly worse. The reason is where the
# leftover 0.286 of the scale factor ends up:
#   prescale 2: 448 -> 960, every row is a blend. Error spread evenly, so
#               motion is calm but the whole image is uniformly soft.
#   prescale 4: 896 -> 960, most rows map ~1:1 and are crisp, but roughly
#               every 14th row is a blend. Few wrong rows among many right
#               ones, and they travel as the image scrolls -- much more
#               visible than a uniform softness, despite a smaller average
#               error.
# Concentrating the error is worse than spreading it. No prescale value
# avoids both at 1280x960; see the memory note for the paths that would.
#
# So: prescale 2 (inherited from mame.ini) with bilinear on. Scaling stays
# fractional, which is what keeps the -effect overlay drawing at all, and
# the 2-row-period scanlines-strong.png matches prescale 2 correctly.
# The -p4 overlays remain in arcade/artwork for if prescale 4 is revisited.

filter                    1
