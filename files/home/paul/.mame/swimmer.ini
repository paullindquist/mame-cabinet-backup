# Per-game overrides for Swimmer (Tehkan 1982).
# Found via inipath ($HOME/.mame;/etc/mame) as <gamename>.ini.
# Per-game on purpose: mk2 is the priority game and keeps the known-good
# -effect overlay path untouched by anything tried here.
#
# GLSL VERSION. To go back to the overlay version that works but is slightly
# soft:   mv ~/.mame/swimmer.ini.overlay ~/.mame/swimmer.ini
#
# ---------------------------------------------------------------------------
# Why a shader at all
#
# 960/224 = 4.286, so a source row cannot occupy a whole number of screen
# rows. Everything before this was a way of choosing where that 0.286 goes:
#   filter 0            64 rows take 5px, 160 take 4px, and which is which
#                       shifts as the image scrolls -> shimmer
#   filter 1, prescale 2  every row blended -> calm but uniformly soft
#   filter 1, prescale 4  most rows crisp, every ~14th blended, and those
#                       travel with the scroll -> worse
#   integer scaling     perfect, but silently kills the -effect overlay
# No prescale avoids both, and no display mode helps: 224 x {2,3,4,5} =
# 448/672/896/1120 and the panel offers none of them.
#
# A shader escapes the trade entirely by doing sharp bilinear -- snap to
# texel centres, then blend across exactly one screen pixel at the boundary.
# Pixels stay crisp because the blend is confined to the seam, and nothing
# snaps because a row may land between pixels. Scanlines are drawn in the
# same pass, phase-locked to the source grid, so they cannot crawl.
#
# ---------------------------------------------------------------------------
# Constraints found the hard way
#
# * MAME disables GLSL entirely unless prescale is 1 -- it says so explicitly:
#     "OpenGL: GLSL supported, but disabled due to: prescale !=1"
#   So prescale 1 here, and the -effect overlay is off, since it needs
#   prescale >= 2 to put one scanline on each source line. Shader and overlay
#   are mutually exclusive; the shader draws the scanlines now.
# * Shader files are named asymmetrically: the vertex stage is <name>.vsh but
#   the fragment stage is <name>_rgb32_dir.fsh. Getting this wrong reports
#   "cannot open shader_file".
# * gl_glsl_filter must be 1 (bilinear). The sharp-bilinear maths needs
#   GL_LINEAR sampling to do its blend; at 0 texture2D returns nearest and
#   the shader degenerates to plain nearest, i.e. the original shimmer.
#
# Measured cost: 806% vs 829% of realtime without it -- about 2.7%.

# ---------------------------------------------------------------------------
# Scanline strength: change the LAST LINE only, then relaunch the game.
# The shader recompiles every launch, so there is nothing to rebuild.
#
#   scanline-off      no scanlines, sharp shimmer-free scaling only
#   scanline-subtle   dark 0.85, thickness 0.35   <- current
#   scanline-light    dark 0.78, thickness 0.40
#   scanline-medium   dark 0.65, thickness 0.50
#   scanline-strong   dark 0.45, thickness 0.50
#
# All five are identical apart from those two constants -- the sharp-bilinear
# scaling that fixed the shimmer is in every one, including scanline-off.
#
# Note the numbers do NOT correspond to the old -effect PNG values. The
# overlay path smeared its bands through a 2.14x bilinear upscale, so it
# always looked far weaker than its nominal figure; the shader draws them
# crisply at output resolution, where the same number is much heavier.

prescale                  1
effect                    none
gl_glsl                   1
gl_glsl_filter            1
glsl_shader_mame0         /home/paul/arcade/shaders/scanline-medium
